<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>WG课程表 · 导入课表</title>

  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/pages.css">
</head>

<body>
  <header class="app-header">
    <a class="app-header__back" href="./index.html">返回</a>
    <h1 class="app-header__title">导入课表</h1>
  </header>

  <!-- 页面导航：三个页面共用的跳转入口（Day 10 从视口底部挪到这里，与首页保持一致） -->
  <nav class="app-nav">
    <a class="app-nav__item" href="./index.html">今日</a>
    <a class="app-nav__item is-active" href="./import.html">导入</a>
    <a class="app-nav__item" href="./settings.html">设置</a>
    <a class="app-nav__item" href="./entry.html">换课表</a>
  </nav>

  <main class="app-main">
    <!-- ============================================================
         V2.1 导入前视图
         PRD 说：「选择课表文件」按钮 + 三步操作说明 +「手动添加课程」入口
         Day 25（T3 接线第 2 步）：按钮接通真解析（js/parser.js），
         解析结果在下方 V2.2 预览区展示，确认后才谈保存。
         ============================================================ -->
    <section class="card">
      <p class="section-title">从教务系统导出课表文件</p>
      <ol class="steps">
        <li class="steps__item">
          <span class="steps__num">1</span>
          <span>登录学校教务系统，进入「学生个人课表」</span>
        </li>
        <li class="steps__item">
          <span class="steps__num">2</span>
          <span>找到「学生个人课表」，列表展示或表格展示都可以</span>
        </li>
        <li class="steps__item">
          <span class="steps__num">3</span>
          <span>点击「导出」，保存导出的文件（.xls / .htm 都可以）</span>
        </li>
      </ol>

      <div class="action-row">
        <button class="btn btn--primary" type="button" id="import-select-btn">选择课表文件</button>
        <a class="btn btn--ghost" href="./settings.html">先去看看设置</a>
        <!-- 隐藏的文件选择框：由上面的按钮代它打开（见 js/ui-import.js）。
             Day 25 接真解析后把 accept 加了回来（教务导出的 .xls 实为网页格式，
             所以 .htm/.html/.xls/.xlsx 都收）；解析失败的兜底仍由解析器三分类承担，
             用户选了别的文件会得到明确的「不是课表文件」报错，而不是没反应。 -->
        <input type="file" id="import-file-input"
               accept=".htm,.html,.xls,.xlsx" hidden>
      </div>
      <p class="page-note">
        文件只在你手机上解析，确认保存之前不会上传任何内容。
      </p>
    </section>

    <!-- ============================================================
         V2.2 解析预览（Day 25 新增，解析成功才显示）
         PRD 说：解析结果统计 + 预览 +「保存并使用」；
         保存时的「将替换现有课表」二次确认在 js/ui-import.js 里弹。
         ============================================================ -->
    <section class="card" id="import-preview" hidden>
      <p class="section-title">解析结果</p>
      <p class="page-note" id="import-preview-stats"></p>
      <div id="import-preview-list"></div>
      <div class="action-row">
        <button class="btn btn--primary" type="button" id="import-save-btn" hidden>保存并使用</button>
        <button class="btn btn--ghost" type="button" id="import-reselect-btn">重新选文件</button>
      </div>
    </section>

    <!-- ============================================================
         V2.5 手动指定列（Day 30 · 方案 D，自动识别失败时的兜底）
         为什么要有它：各校课表的表头文字千奇百怪，别名表不可能穷举完。
         与其让用户卡在「导入失败」，不如把表格前几行摆出来，
         让他自己指认「哪一列是课程名、哪一列是周次」——
         人看一眼就知道的事，不该让程序去猜。
         ============================================================ -->
    <section class="card" id="import-manual" hidden>
      <p class="section-title">手动指定列</p>
      <p class="page-note" id="import-manual-tip">
        自动识别没成功。下面是文件里的前几行，请告诉我每一列是什么。
      </p>

      <div class="manual-head">
        <label class="manual-head__label" for="manual-header-row">表头在第</label>
        <select class="manual-head__select" id="manual-header-row"></select>
        <span class="manual-head__label">行</span>
      </div>

      <div class="manual-table-wrap">
        <table class="manual-table" id="manual-table"></table>
      </div>

      <div class="manual-fields" id="manual-fields">
        <!-- 下拉框由 js/ui-import.js 动态生成：6 个字段 × 列选项 -->
      </div>

      <div class="action-row">
        <button class="btn btn--primary" type="button" id="manual-parse-btn">按这个对应关系解析</button>
        <button class="btn btn--ghost" type="button" id="manual-cancel-btn">取消</button>
      </div>
      <p class="page-note">
        带 * 的四项必须指定，其余可以留空。地点留空时课程卡片会显示「—」。
      </p>
    </section>

    <!-- ============================================================
         后续阶段要实现的视图，本阶段留占位注释
         - V2.4 课程管理（新增 / 修改 / 删除）→ T4
         ============================================================ -->
  </main>

  <!-- 状态弹窗 → 解析器 → 导入页交互，顺序不能反（后两者都被 ui-import 调用） -->
  <!-- Day 25：口令模块最先加载（ui-import.js 的读写都要带上口令），顺序不能反 -->
  <script src="./js/schedule-code.js"></script>
  <script src="./js/ui-modal.js"></script>
  <!-- Day 29：SheetJS 读二进制 .xls/.xlsx（网格式课表常见），必须早于 grid-parser 与 ui-import -->
  <script src="./js/vendor/xlsx.full.min.js"></script>
  <script src="./js/parser.js"></script>
  <!-- Day 29：网格式解析器（行=节次、列=星期），与列表式 parser.js 并行存在 -->
  <script src="./js/grid-parser.js"></script>
  <script src="./js/ui-import.js"></script>
</body>

</html>
