<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>WG课程表 · 导入课表</title>

  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/pages.css">
</head>

<body>
  <header class="app-header">
    <a class="app-header__back" href="./index.html">返回</a>
    <h1 class="app-header__title">导入课表</h1>
  </header>

  <!-- 页面导航：三个页面共用的跳转入口（Day 10 从视口底部挪到这里，与首页保持一致） -->
  <nav class="app-nav">
    <a class="app-nav__item" href="./index.html">今日</a>
    <a class="app-nav__item is-active" href="./import.html">导入</a>
    <a class="app-nav__item" href="./settings.html">设置</a>
  </nav>

  <main class="app-main">
    <!-- ============================================================
         V2.1 导入前视图（本阶段实现外观骨架）
         PRD 说：「选择课表文件」按钮 + 三步操作说明 +「手动添加课程」入口
         本阶段不接文件解析（属 T2 / T3），按钮先不绑定任何行为
         ============================================================ -->
    <section class="card">
      <p class="section-title">从教务系统导出课表文件</p>
      <ol class="steps">
        <li class="steps__item">
          <span class="steps__num">1</span>
          <span>登录学校教务系统，进入「学生个人课表」</span>
        </li>
        <li class="steps__item">
          <span class="steps__num">2</span>
          <span>把展示方式切换为「列表展示」</span>
        </li>
        <li class="steps__item">
          <span class="steps__num">3</span>
          <span>点击「导出」，保存导出的 .htm 文件</span>
        </li>
      </ol>

      <div class="action-row">
        <!-- Day 11：按钮接上「上传状态反馈」（前端临时状态：只看扩展名、不解析内容）。
             真正的文件解析属 T2/T3，到时替换 js/ui-import.js 里的模拟分支。 -->
        <button class="btn btn--primary" type="button" id="import-select-btn">选择课表文件</button>
        <a class="btn btn--ghost" href="./settings.html">先去看看设置</a>
        <!-- 隐藏的文件选择框：由上面的按钮代它打开（见 js/ui-import.js）。
             ⚠️ 故意不设 accept 过滤（Day 11 测试中发现的问题）：
             设了的话浏览器会把非 .htm 文件直接藏出选择框，用户「想选错都选不到」，
             「上传失败」这条反馈就永远看不到，只会在空荡荡的选择框里困惑。
             让所有文件都可选，失败交给 js/ui-import.js 的扩展名校验去弹。
             T2/T3 接真解析时再把 accept 加回来，那时的失败由解析结果决定。 -->
        <input type="file" id="import-file-input" hidden>
      </div>
      <p class="page-note">
        「上传加载中 / 成功 / 失败」是 Day 11 新加的状态反馈演示：
        不解析文件内容、不保存数据；真正的导入功能属后续任务（T2–T4）。
      </p>
    </section>

    <!-- ============================================================
         后续阶段要实现的视图，本阶段留占位注释
         - V2.2 导入成功（解析结果统计 + 保存并使用 + 替换前二次确认）→ T3
         - V2.3 导入失败（区分三种原因）→ T3
         - V2.4 课程管理（新增 / 修改 / 删除）→ T4
         ============================================================ -->
  </main>

  <!-- Day 11 状态弹窗：先加载弹窗组件、再加载导入页交互，顺序不能反 -->
  <script src="./js/ui-modal.js"></script>
  <script src="./js/ui-import.js"></script>
</body>

</html>
